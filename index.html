<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Piano Learn · Apprendre le piano pas à pas</title>
  <meta name="description" content="Apprendre le piano à la maison avec un prof en 3D : il montre, tu joues sur ton piano, le site écoute. Et ton instrument grandit avec toi.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#04050b">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://tonejs.github.io" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Music&family=Space+Grotesk:wght@400;500;600&family=Unbounded:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" crossorigin>
</head>
<body>
  <!-- Entree : un seul do, et ses deux touches noires -->
  <div class="gate" id="gate" hidden>
    <div class="gate-inner">
      <div class="gate-keys">
        <button class="gk w c" data-midi="60" aria-label="Do. Touche-le pour entrer."><span>Do</span></button>
        <span class="gk w" data-midi="62" aria-hidden="true"></span>
        <span class="gk w" data-midi="64" aria-hidden="true"></span>
        <span class="gk b" data-midi="61" style="--x:1" aria-hidden="true"></span>
        <span class="gk b" data-midi="63" style="--x:2" aria-hidden="true"></span>
      </div>
      <p class="gate-hint">Touche le do pour entrer</p>
      <p class="gate-sub">Le son s’allume avec lui</p>
    </div>
  </div>

  <div class="sweep" id="sweep" aria-hidden="true"></div>

  <div class="ambient" aria-hidden="true">
    <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
    <div class="gridfloor"></div>
  </div>
  <div class="grain" aria-hidden="true"></div>
  <div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>

  <header class="topbar">
    <a href="#/" class="brand" aria-label="Piano Learn, accueil">
      <img src="favicon.svg" alt="" width="30" height="30">
      <span>PIANO<b>LEARN</b></span>
    </a>
    <nav class="nav" id="nav" aria-label="Navigation principale">
      <a href="#/parcours" data-route="parcours">Parcours</a>
      <a href="#/piano" data-route="piano">Mon piano</a>
      <a href="#/morceaux" data-route="morceaux">Morceaux</a>
      <a href="#/profil" data-route="profil">Profil</a>
    </nav>
    <div class="eq" id="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <a href="#/profil" class="xp-chip" id="xp-chip" title="Ton niveau">
      <span class="xp-level" id="xp-level">NIV 1</span>
      <span class="xp-bar"><span class="xp-fill" id="xp-fill"></span></span>
    </a>
  </header>

  <main id="app" class="app"></main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
